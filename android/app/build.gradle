import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def versionProperties = new Properties()
rootProject.file('version.properties').withInputStream { versionProperties.load(it) }

def versionCodeError = 'android/version.properties must define VERSION_CODE as an integer from 1 to 2100000000.'
def versionCodeText = versionProperties.getProperty('VERSION_CODE')
if (!(versionCodeText ==~ /\d+/)) {
    throw new GradleException(versionCodeError)
}

def appVersionCode = new BigInteger(versionCodeText)
if (appVersionCode < 1 || appVersionCode > 2100000000) {
    throw new GradleException(versionCodeError)
}

def appVersionName = new JsonSlurper().parse(rootProject.file('../package.json')).version
if (!(appVersionName instanceof String) || appVersionName.trim().isEmpty()) {
    throw new GradleException('package.json must define a non-empty version.')
}

def signingVariableNames = [
    'ANDROID_KEYSTORE_PATH',
    'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS',
    'ANDROID_KEY_PASSWORD',
]
def signingValues = signingVariableNames.collectEntries { name ->
    [(name): System.getenv(name)]
}
def missingSigningVariables = signingVariableNames.findAll { name ->
    !signingValues[name]
}
def signingConfigured = missingSigningVariables.isEmpty()
def signingPartiallyConfigured = missingSigningVariables.size() < signingVariableNames.size()
def releaseSigningError = "Release signing requires: ${missingSigningVariables.join(', ')}"

if (signingPartiallyConfigured && !signingConfigured) {
    throw new GradleException(releaseSigningError)
}

tasks.configureEach { task ->
    if (!signingConfigured && task.name.toLowerCase().contains('release')) {
        task.doFirst {
            throw new GradleException(releaseSigningError)
        }
    }
}

def releaseKeystore = signingConfigured ? file(signingValues.ANDROID_KEYSTORE_PATH) : null
if (signingConfigured && (!releaseKeystore.isFile() || !releaseKeystore.canRead())) {
    throw new GradleException('ANDROID_KEYSTORE_PATH must point to a readable keystore file.')
}

android {
    namespace = "fr.dogeo.osmgo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.dogeo.osmgo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode.toInteger()
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingConfigured) {
            release {
                storeFile releaseKeystore
                storePassword signingValues.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingValues.ANDROID_KEY_ALIAS
                keyPassword signingValues.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
