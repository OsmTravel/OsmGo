name: Deploy development to GitHub Pages

on:
    push:
        branches:
            - develop

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    build:
        name: Build development PWA
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.build-info.outputs.version }}
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test:ci

            - name: Build the PWA
              run: npm run build -- --base-href=/OsmGo/

            - name: Add build information
              id: build-info
              run: |
                  node scripts/write-web-build-info.mjs www
                  version="$(node -p 'require("./package.json").version')"
                  echo "version=${version}" >>"${GITHUB_OUTPUT}"

            - name: Check the build output
              run: test -f www/index.html && test -f www/build-info.json

            - name: Configure GitHub Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload the GitHub Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: www

    deploy:
        name: Deploy development PWA
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

            - name: Verify the deployed build
              shell: bash
              env:
                  DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
                  EXPECTED_VERSION: ${{ needs.build.outputs.version }}
                  EXPECTED_COMMIT: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  expected="$(printf '{"version":"%s","commit":"%s"}' "${EXPECTED_VERSION}" "${EXPECTED_COMMIT}")"
                  actual="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "${DEPLOYMENT_URL%/}/build-info.json?commit=${EXPECTED_COMMIT}")"
                  if [[ "${actual}" != "${expected}" ]]; then
                      echo "The GitHub Pages deployment does not match the expected build." >&2
                      exit 1
                  fi
