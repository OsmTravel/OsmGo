name: Validate changes

on:
    pull_request:
        branches:
            - develop
            - main

concurrency:
    group: validation-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: Validate web application
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check source code
              run: npm run check

            - name: Check formatting
              run: npm run prettier:check

            - name: Run unit tests
              run: npm run test:ci

            - name: Run converter tests
              run: npm run test:converter

            - name: Run data generation tests
              run: npm run test:scripts

            - name: Check generated data is committed
              run: git diff --exit-code -- src/assets/tagsAndPresets

            - name: Run sprite tests
              run: npm run test:sprites

            - name: Build the PWA
              run: npm run build

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run integration tests
              run: npm run test:integration
