<section
    class="map-screen"
    [class.has-selection]="selectedFeature()"
    [class.sheet-expanded]="sheetLevel() === 'expanded'"
    [style.--map-controls-bottom]="mapControlsBottom()"
    [attr.inert]="overlayOpen() ? '' : null"
    [attr.aria-hidden]="overlayOpen() ? 'true' : null"
>
    <div id="map" #map data-testid="map" class="map-canvas"></div>

    <app-map-controls
        [newVersion]="newVersion()"
        [attr.inert]="sheetLevel() === 'expanded' ? '' : null"
        [attr.aria-hidden]="sheetLevel() === 'expanded' ? 'true' : null"
        (menuRequested)="openMenu()"
        (refreshRequested)="loadData()"
        (addRequested)="startAddingObject()"
    ></app-map-controls>

    @if (displayedSelection(); as selection) {
    <app-object-sheet
        #objectSheet
        [selection]="selection"
        [level]="sheetLevel()"
        (levelChange)="sheetLevel.set($event)"
        (closeRequested)="closeSelection()"
        (detailsRequested)="openSelectedDetails()"
        (editRequested)="editSelectedFeature()"
        (sessionCompleted)="handleSheetSession($event)"
    ></app-object-sheet>
    }
</section>

<menu-component
    [menuIsOpen]="menuIsOpen()"
    [newVersion]="newVersion()"
    (closeEvent)="closeMenu()"
    [attr.inert]="overlayOpen() ? '' : null"
    [attr.aria-hidden]="overlayOpen() ? 'true' : null"
></menu-component>

<div
    class="route-overlay-host"
    [class.is-open]="overlayOpen()"
    [attr.data-overlay-size]="overlaySize()"
    [attr.aria-hidden]="overlayOpen() ? null : 'true'"
>
    @if (overlayOpen()) {
    <button
        class="route-overlay-backdrop"
        type="button"
        [attr.aria-label]="'SHARED.CLOSE' | translate"
        (click)="closeOverlay()"
    ></button>
    }
    <section
        class="route-overlay-panel"
        role="dialog"
        [attr.aria-modal]="overlayOpen() ? 'true' : null"
        [attr.aria-label]="'MAIN.OVERLAY.LABEL' | translate"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="overlayOpen()"
    >
        <router-outlet
            (activate)="onOverlayActivate($event)"
            (deactivate)="onOverlayDeactivate()"
        ></router-outlet>
    </section>
</div>
