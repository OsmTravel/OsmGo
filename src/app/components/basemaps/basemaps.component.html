<ion-header color="primary">
    <ion-toolbar color="primary">
        <ion-buttons style="min-width: 32px" slot="primary">
            <ion-button (click)="navCtrl.back()">
                <ion-icon
                    name="chevron-back-outline"
                    slot="icon-only"
                ></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>{{ 'SETTINGS.AERIAL_IMAGERY' | translate }}</ion-title>
    </ion-toolbar>
</ion-header>

@if (this.initService.isLoaded) {
    <ion-content class="ion-padding">
        <h4>{{ 'SETTINGS.AERIAL_IMAGERY_HINT' | translate }}</h4>
        @for (bm of basemaps; track bm) {
            <ion-card
                (click)="selectBaseMap(bm)"
                [ngClass]="{
                    selectedCard: bm.id == configService.config.basemap.id,
                }"
            >
                <ion-card-header>
                    <ion-card-subtitle
                        >{{ bm?.category }}
                        {{ bm?.end_date }}</ion-card-subtitle
                    >
                    <ion-card-title>{{ bm.name }}</ion-card-title>
                </ion-card-header>
                <ion-card-content>
                    @if (bm.description) {
                        <p [innerText]="bm.description"></p>
                    }
                    <p>{{ bm?.attribution?.text }}</p>
                </ion-card-content>
            </ion-card>
        }
    </ion-content>
}
