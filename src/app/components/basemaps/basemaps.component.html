<main class="basemaps-screen">
    <app-screen-header
        [title]="'SETTINGS.AERIAL_IMAGERY' | translate"
        (backRequested)="back()"
    ></app-screen-header>

    @if (initService.isLoaded) {
        <div class="basemaps-content">
            <p class="screen-intro">
                {{ 'SETTINGS.AERIAL_IMAGERY_HINT' | translate }}
            </p>

            @if (basemaps().length === 0) {
                <div class="loading-state" role="status">
                    <mat-spinner diameter="32"></mat-spinner>
                </div>
            } @else {
                <div class="basemap-grid" role="list">
                    @for (bm of basemaps(); track bm.id) {
                        <button
                            class="basemap-card"
                            type="button"
                            role="listitem"
                            matRipple
                            [class.is-selected]="
                                bm.id === configService.config().basemap.id
                            "
                            [attr.aria-pressed]="
                                bm.id === configService.config().basemap.id
                            "
                            (click)="selectBaseMap(bm)"
                        >
                            <span class="basemap-card__topline">
                                <span>{{ bm.category }} {{ bm.end_date }}</span>
                                @if (
                                    bm.id === configService.config().basemap.id
                                ) {
                                    <mat-icon
                                        fontSet="material-symbols-rounded"
                                        aria-hidden="true"
                                        >check_circle</mat-icon
                                    >
                                }
                            </span>
                            <strong>{{ bm.name }}</strong>
                            @if (bm.description) {
                                <span class="basemap-card__description">{{
                                    bm.description
                                }}</span>
                            }
                            @if (bm.attribution?.text) {
                                <span class="basemap-card__attribution">{{
                                    bm.attribution?.text
                                }}</span>
                            }
                        </button>
                    }
                </div>
            }
        </div>
    }
</main>
