<ion-toolbar>
    <ion-title>
        {{ data().preset.lbl[language] || data().preset.lbl['en'] }}
    </ion-title>
</ion-toolbar>
<div id="divContentSB">
    <div id="searchDiv">
        <ion-searchbar
            [value]="searchText()"
            (ionInput)="onSearchInput($event)"
            [debounce]="300"
        ></ion-searchbar>
    </div>
</div>

<div class="listTag">
    <ion-list>
        <ion-radio-group (ionChange)="selected($event)">
            @for (option of data().preset.options |
            filterByCountryCode:countryCode |
            filterByPresetsContent:[language]:searchText(); track option) {
            <ion-item>
                <ion-label>
                    <b>{{option.lbl[language] || option.lbl['en'] }}</b>
                    <br />
                    {{option.v}}
                </ion-label>
                <ion-radio [value]="option"></ion-radio>
            </ion-item>
            }
        </ion-radio-group>
    </ion-list>
</div>
<ion-footer id="footer">
    <ion-button ion-button color="danger" (click)="dismiss()"
        >{{ 'SHARED.CANCEL' | translate}}</ion-button
    >
</ion-footer>
