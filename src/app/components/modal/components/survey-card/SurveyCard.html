<ion-card>
    <ion-card-content>
        <p>{{ 'MODAL_SELECTED_ITEM.SURVEY_QUESTION' | translate }}</p>
    </ion-card-content>
    <div class="actions">
        <ion-button class="yes-button" fill="clear" (click)="handleYes()">
            <ion-icon
                aria-hidden="true"
                name="checkmark"
                slot="start"
            ></ion-icon>
            {{ 'SHARED.YES' | translate }}
        </ion-button>
        <ion-button
            fill="clear"
            color="danger"
            (click)="handleNo()"
            [disabled]="feature().properties.type !== 'node'"
        >
            <ion-icon aria-hidden="true" name="close" slot="start"></ion-icon>
            {{ 'SHARED.NO' | translate }}
        </ion-button>
    </div>
</ion-card>
