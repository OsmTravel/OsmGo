<article class="tag-row" [class.is-current]="oldTagConfig()?.id === tag().id">
    <button class="tag-row__main" type="button" (click)="selected.emit(tag())">
        <span
            class="tag-icon"
            [style.background-color]="tag().markerColor || '#26352f'"
            aria-hidden="true"
        >
            <app-icon
                [icon]="tag().icon"
                [jsonSprites]="jsonSprites()"
            ></app-icon>
        </span>

        <span class="tag-copy">
            <strong>{{
                tag().lbl?.[languageTags()] || tag().lbl?.['en']
            }}</strong>
            <span class="tag-values">{{
                $safeNavigationMigration(tag()?.tags) | displayTags
            }}</span>
            @if (
                tag().description?.[languageTags()] || tag().description?.['en']
            ) {
                <span class="tag-description">
                    {{
                        tag().description?.[languageTags()] ||
                            tag().description?.['en']
                    }}
                </span>
            }
        </span>
    </button>

    <div class="tag-actions">
        @if (!isHiddenTag()) {
            <button
                mat-icon-button
                type="button"
                [class.is-bookmarked]="tag() | isBookmarked: bookmarksIds()"
                [matTooltip]="
                    (tag() | isBookmarked: bookmarksIds())
                        ? 'Retirer des favoris'
                        : 'Ajouter aux favoris'
                "
                [attr.aria-label]="
                    (tag() | isBookmarked: bookmarksIds())
                        ? 'Retirer des favoris'
                        : 'Ajouter aux favoris'
                "
                (click)="addOrRemoveBookmark(tag())"
            >
                <mat-icon fontSet="material-symbols-rounded" aria-hidden="true">
                    {{
                        (tag() | isBookmarked: bookmarksIds())
                            ? 'bookmark'
                            : 'bookmark_border'
                    }}
                </mat-icon>
            </button>
        }

        @if (oldTagConfig()?.id === tag().id) {
            <span class="current-indicator" aria-label="Sélectionné">
                <mat-icon fontSet="material-symbols-rounded"
                    >check_circle</mat-icon
                >
            </span>
        }

        @if (isHiddenTag()) {
            <button
                mat-icon-button
                class="show-action"
                type="button"
                aria-label="Afficher ce tag"
                (click)="removeHiddenTag.emit(tag())"
            >
                <mat-icon fontSet="material-symbols-rounded"
                    >visibility</mat-icon
                >
            </button>
        }

        @if (showHideTagButton()) {
            <button
                mat-icon-button
                class="hide-action"
                type="button"
                aria-label="Masquer ce tag"
                (click)="addHiddenTag.emit(tag())"
            >
                <mat-icon fontSet="material-symbols-rounded"
                    >visibility_off</mat-icon
                >
            </button>
        }
    </div>
</article>
